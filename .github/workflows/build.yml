name: build

# Cancel superseded runs (a new push aborts the previous build)
concurrency:
  group: c7ltechn-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Optional runner label override for the ROM job (e.g.
          ubuntu-22.04-16core on GitHub Larger Runners). Default: ubuntu-latest.'
        required: false
        default: ''
      build_target:
        description: 'ROM build target'
        required: false
        default: 'bacon'
  push:
    branches: [ 'main' ]
    # NOTE: device tree files live at the repo ROOT (see README) — any push builds

jobs:
  kernel-build:
    name: kernel (Image.gz-dtb)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    timeout-minutes: 180
    env:
      WORK: /tmp/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: manifest-repo
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          mkdir -p /etc/ssl/certs/java
          apt-get install -y --no-install-recommends \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python2 python2-dev python3 python3-dev openjdk-8-jdk libncurses5 \
            lib32stdc++6 lib32gcc1 libc6-i386 lib32z1 bc rsync ccache file imagemagick
          ln -sf /usr/bin/python2 /usr/local/bin/python
          if ! curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo; then
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/main/repo -o /usr/local/bin/repo || \
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/stable/repo -o /usr/local/bin/repo
          fi
          chmod +x /usr/local/bin/repo
          test -s /usr/local/bin/repo
          repo --version
      - name: Initialize repo
        run: |
          git config --global user.name "c7ltechn-bot"
          git config --global user.email "c7ltechn-bot@users.noreply.github.com"
          mkdir -p "$WORK"
          cd "$WORK"
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifest-repo/manifest/c7ltechn-16.0.xml" .repo/local_manifests/
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('.repo/local_manifests/c7ltechn-16.0.xml'); print('manifest XML OK')"
      - name: Sync kernel only
        run: |
          cd "$WORK"
          repo sync -c -j8 --no-tags --no-clone-bundle kernel/samsung/msm8953
          df -h /tmp
      - name: Fetch aarch64 gcc 4.9 toolchain (git clone preserves symlinks)
        run: |
          mkdir -p "$WORK/toolchain"
          git clone --depth 1 -b lineage-17.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            "$WORK/toolchain"
          chmod +x "$WORK/toolchain/bin/"* 2>/dev/null || true
          # The 4.9-era toolchains ship ~1.7KB wrapper scripts named like the
          # real compiler (aarch64-linux-android-gcc) which fail to exec in the
          # container; the real ELF binaries are gcc-4.9.x / real-<name>.
          # Replace small wrapper files with symlinks to the real binaries.
          cd "$WORK/toolchain/bin"
          for n in *; do
            [ -L "$n" ] && continue
            [ -f "$n" ] || continue
            sz=$(stat -c%s "$n")
            if [ "$sz" -lt 20000 ]; then
              for cand in "real-$n" "$n-4.9.x" "$n-4.9"; do
                if [ -f "$cand" ] && [ "$(stat -c%s "$cand")" -gt 20000 ]; then
                  echo "repair: $n -> $cand"
                  ln -sfn "$cand" "$n"
                  break
                fi
              done
            fi
          done
          cd "$WORK"
          ls -la "$WORK/toolchain/bin/" | grep -E 'gcc|g\+\+|cc$|ld$' | head
          test -x "$WORK/toolchain/bin/aarch64-linux-android-gcc"
      - name: Patch kernel (trace includes + F_MIDI + sanity)
        run: |
          cd "$WORK/kernel/samsung/msm8953"
          # 1) fix TRACE_INCLUDE_PATH . (broken in this repo branch) in ANY header
          found=0
          for f in $(grep -rl '^#define TRACE_INCLUDE_PATH \.$' --include='*.h' . 2>/dev/null); do
            dir=$(dirname "$f")
            rel=$(python3 -c "import os; print(os.path.relpath('$dir', 'include/trace'))")
            sed -i "s|^#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH $rel|" "$f"
            echo "patched $f -> $rel"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "no TRACE_INCLUDE_PATH patches needed"
          fi
          # 2) disable the USB MIDI pieces (android.c does '#include "f_midi.c"'
          #    under CONFIG_SND_RAWMIDI; f_midi.c needs u_f.h which is missing
          #    from the Galaxy-MSM8953 kernel mirrors on every branch)
          sed -i 's|^CONFIG_SND_RAWMIDI=y|# CONFIG_SND_RAWMIDI is not set|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          if ! grep -q 'CONFIG_USB_CONFIGFS_F_MIDI' arch/arm64/configs/lineageos_c7ltechn_defconfig; then
            echo '# CONFIG_USB_CONFIGFS_F_MIDI is not set' >> arch/arm64/configs/lineageos_c7ltechn_defconfig
          fi
          grep -n 'SND_RAWMIDI' arch/arm64/configs/lineageos_c7ltechn_defconfig
          # 3) msm_dba: '<msm_dba_internal.h>' is angle-quoted so it is not
          #    found (no -I for that dir); switch to quoted include
          if grep -rl '#include <msm_dba_internal.h>' drivers/video/msm/msm_dba/ 2>/dev/null; then
            grep -rl '#include <msm_dba_internal.h>' drivers/video/msm/msm_dba/ |               xargs sed -i 's|#include <msm_dba_internal.h>|#include "msm_dba_internal.h"|'
            echo "msm_dba: angle include switched to quoted"
          fi
          # 4) Switch USB gadget: Samsung's legacy g_android (+ its function
          #    sources, several of which are broken in this mirror) is replaced
          #    by the AOSP configfs gadget, which LOS16's usb HAL expects.
          sed -i 's|^CONFIG_USB_G_ANDROID=y|# CONFIG_USB_G_ANDROID is not set|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          sed -i 's|^CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE=y|# CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE is not set|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          sed -i 's|^# CONFIG_USB_CONFIGFS is not set|CONFIG_USB_CONFIGFS=y|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          grep -n 'USB_G_ANDROID\|USB_CONFIGFS\|USB_ANDROID_SAMSUNG' arch/arm64/configs/lineageos_c7ltechn_defconfig || true
          # 5) set_ncm_ready was exported by the Samsung g_android gadget (now
          #    disabled); stub-remove its only external user
          sed -i '/extern void set_ncm_ready/d' drivers/usb/notify/usb_notifier_qcom.c
          sed -i '/set_ncm_ready(false)/d' drivers/usb/notify/usb_notifier_qcom.c
          sed -i '/^    if(!enable)$/d' drivers/usb/notify/usb_notifier_qcom.c
          grep -n 'set_ncm_ready' drivers/usb/notify/usb_notifier_qcom.c || echo "set_ncm_ready: removed"
          # 3) checkout sanity diagnostics
          for f in drivers/video/msm/msm_dba/msm_dba_internal.h                    drivers/soc/qcom/tracer_pkt_private.h                    drivers/usb/gadget/function/f_midi.c                    drivers/net/ethernet/msm/rndis_ipa_trace.h; do
            if [ -f "$f" ]; then echo "OK  $f"; else echo "MISS $f"; fi
          done
      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          cd "$WORK/kernel/samsung/msm8953"
          export PATH="$WORK/toolchain/bin:$PATH"
          which aarch64-linux-android-gcc
          "$WORK/toolchain/bin/aarch64-linux-android-gcc" --version 2>&1 | head -1
          make ARCH=arm64 lineageos_c7ltechn_defconfig
          ./scripts/config --disable SND_RAWMIDI --disable USB_G_ANDROID \
            --disable USB_ANDROID_SAMSUNG_COMPOSITE --enable USB_CONFIGFS
          grep -E 'SND_RAWMIDI|USB_G_ANDROID|USB_CONFIGFS|MSM_DBA' .config || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- -j$(nproc) Image.gz-dtb > /tmp/kbuild.log 2>&1 || rc=$?
          tail -60 /tmp/kbuild.log
          ls -la arch/arm64/boot/
          exit ${rc:-0}
      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7ltechn-kernel-${{ github.run_number }}
          path: |
            /tmp/android/kernel/samsung/msm8953/arch/arm64/boot/Image.gz-dtb
            /tmp/android/kernel/samsung/msm8953/.config
            /tmp/kbuild.log
          if-no-files-found: warn

  rom-build:
    name: ROM (boot+recovery+system)
    # Runs on every trigger. Standard runners (7GB RAM / ~145GB disk) can now
    # hold a LOS16 tree; RAM is tight so a swap file + low parallelism is used.
    # A GitHub Larger Runner (e.g. ubuntu-22.04-16core) is recommended for fast,
    # reliable full builds — pass it via the 'runner' input.
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    container:
      image: ubuntu:20.04
    timeout-minutes: 360
    env:
      WORK: /tmp/android
      CCACHE_DIR: /tmp/ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: manifest-repo
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          mkdir -p /etc/ssl/certs/java
          apt-get install -y --no-install-recommends \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python2 python2-dev python3 python3-dev openjdk-8-jdk libncurses5 \
            lib32stdc++6 lib32gcc1 libc6-i386 lib32z1 bc rsync ccache file imagemagick
          ln -sf /usr/bin/python2 /usr/local/bin/python
          if ! curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo; then
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/main/repo -o /usr/local/bin/repo || \
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/stable/repo -o /usr/local/bin/repo
          fi
          chmod +x /usr/local/bin/repo
          test -s /usr/local/bin/repo
          repo --version
      - name: Best-effort swap
        run: |
          free -h
          if fallocate -l 8G /tmp/swapfile 2>/dev/null; then
            chmod 600 /tmp/swapfile && mkswap /tmp/swapfile >/dev/null && swapon /tmp/swapfile
            echo "swap enabled"
          fi || true
          df -h /tmp
      - name: Initialize repo
        run: |
          git config --global user.name "c7ltechn-bot"
          git config --global user.email "c7ltechn-bot@users.noreply.github.com"
          mkdir -p "$WORK"
          cd "$WORK"
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifest-repo/manifest/c7ltechn-16.0.xml" .repo/local_manifests/
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('.repo/local_manifests/c7ltechn-16.0.xml'); print('manifest XML OK')"
      - name: Sync sources
        shell: bash
        run: |
          set -o pipefail
          cd "$WORK"
          repo sync -c -j8 --no-tags --no-clone-bundle --force-sync 2>&1 | tail -40 || {
            echo "sync attempt 1 failed, retrying..."
            repo sync -c -j8 --no-tags --no-clone-bundle --force-sync 2>&1 | tail -40
          }
          # fetch webview prebuilts at their pinned SHAs (repo cannot shallow-clone them)
          fetch_webview() {
            arch="$1"; sha="$2"
            dir="$WORK/external/chromium-webview/prebuilt/$arch"
            mkdir -p "$dir" && cd "$dir"
            git init -q
            git remote add origin "https://github.com/LineageOS/android_external_chromium-webview_prebuilt_$arch.git"
            git fetch --depth=1 origin "$sha" 2>&1 | tail -2
            git checkout -q FETCH_HEAD
            ls -la webview.apk 2>/dev/null || echo "WARN: no webview.apk for $arch"
            cd "$WORK"
          }
          fetch_webview arm b2639126d02b401ae8a8a7f3ca302633713a12e6
          fetch_webview arm64 f6f994f9912b26d1dffd100f6de959f9dfd31414
          df -h /tmp
      - name: Patch framework + toolchain
        run: |
          # 1) libbluetooth_jni: build for both arches (32-bit APK variant)
          f="$WORK/packages/apps/Bluetooth/jni/Android.bp"
          if grep -q 'compile_multilib: "first"' "$f"; then
            sed -i 's/compile_multilib: "first"/compile_multilib: "both"/' "$f"
            echo "patched libbluetooth_jni -> both"
          else
            echo "no bluetooth jni patch needed"
          fi
          # 2) repair the 4.9 wrapper scripts in the repo-synced toolchain
          #    (same issue as the standalone kernel job: 1.7KB wrapper scripts
          #    named like the real compiler fail to exec)
          cd "$WORK/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          for n in *; do
            [ -L "$n" ] && continue
            [ -f "$n" ] || continue
            sz=$(stat -c%s "$n")
            if [ "$sz" -lt 20000 ]; then
              for cand in "real-$n" "$n-4.9.x" "$n-4.9"; do
                if [ -f "$cand" ] && [ "$(stat -c%s "$cand")" -gt 20000 ]; then
                  echo "repair: $n -> $cand"
                  ln -sfn "$cand" "$n"
                  break
                fi
              done
            fi
          done
          cd "$WORK"
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}
      - name: Patch kernel (trace includes + F_MIDI + sanity)
        run: |
          cd "$WORK/kernel/samsung/msm8953"
          # 1) fix TRACE_INCLUDE_PATH . (broken in this repo branch) in ANY header
          found=0
          for f in $(grep -rl '^#define TRACE_INCLUDE_PATH \.$' --include='*.h' . 2>/dev/null); do
            dir=$(dirname "$f")
            rel=$(python3 -c "import os; print(os.path.relpath('$dir', 'include/trace'))")
            sed -i "s|^#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH $rel|" "$f"
            echo "patched $f -> $rel"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "no TRACE_INCLUDE_PATH patches needed"
          fi
          # 2) disable the USB MIDI pieces (android.c does '#include "f_midi.c"'
          #    under CONFIG_SND_RAWMIDI; f_midi.c needs u_f.h which is missing
          #    from the Galaxy-MSM8953 kernel mirrors on every branch)
          sed -i 's|^CONFIG_SND_RAWMIDI=y|# CONFIG_SND_RAWMIDI is not set|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          if ! grep -q 'CONFIG_USB_CONFIGFS_F_MIDI' arch/arm64/configs/lineageos_c7ltechn_defconfig; then
            echo '# CONFIG_USB_CONFIGFS_F_MIDI is not set' >> arch/arm64/configs/lineageos_c7ltechn_defconfig
          fi
          grep -n 'SND_RAWMIDI' arch/arm64/configs/lineageos_c7ltechn_defconfig
          # 3) msm_dba: '<msm_dba_internal.h>' is angle-quoted so it is not
          #    found (no -I for that dir); switch to quoted include
          if grep -rl '#include <msm_dba_internal.h>' drivers/video/msm/msm_dba/ 2>/dev/null; then
            grep -rl '#include <msm_dba_internal.h>' drivers/video/msm/msm_dba/ |               xargs sed -i 's|#include <msm_dba_internal.h>|#include "msm_dba_internal.h"|'
            echo "msm_dba: angle include switched to quoted"
          fi
          # 4) Switch USB gadget: Samsung's legacy g_android (+ its function
          #    sources, several of which are broken in this mirror) is replaced
          #    by the AOSP configfs gadget, which LOS16's usb HAL expects.
          sed -i 's|^CONFIG_USB_G_ANDROID=y|# CONFIG_USB_G_ANDROID is not set|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          sed -i 's|^CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE=y|# CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE is not set|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          sed -i 's|^# CONFIG_USB_CONFIGFS is not set|CONFIG_USB_CONFIGFS=y|' arch/arm64/configs/lineageos_c7ltechn_defconfig
          grep -n 'USB_G_ANDROID\|USB_CONFIGFS\|USB_ANDROID_SAMSUNG' arch/arm64/configs/lineageos_c7ltechn_defconfig || true
          # 5) set_ncm_ready was exported by the Samsung g_android gadget (now
          #    disabled); stub-remove its only external user
          sed -i '/extern void set_ncm_ready/d' drivers/usb/notify/usb_notifier_qcom.c
          sed -i '/set_ncm_ready(false)/d' drivers/usb/notify/usb_notifier_qcom.c
          sed -i '/^    if(!enable)$/d' drivers/usb/notify/usb_notifier_qcom.c
          grep -n 'set_ncm_ready' drivers/usb/notify/usb_notifier_qcom.c || echo "set_ncm_ready: removed"
          # 3) checkout sanity diagnostics
          for f in drivers/video/msm/msm_dba/msm_dba_internal.h                    drivers/soc/qcom/tracer_pkt_private.h                    drivers/usb/gadget/function/f_midi.c                    drivers/net/ethernet/msm/rndis_ipa_trace.h; do
            if [ -f "$f" ]; then echo "OK  $f"; else echo "MISS $f"; fi
          done
      - name: Build
        shell: bash
        run: |
          cd "$WORK"
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=/tmp/ccache
          ccache -M 20G
          source build/envsetup.sh
          lunch lineage_c7ltechn-userdebug
          m "${{ github.event.inputs.build_target || 'bacon' }}" -j$(nproc) 2>&1 | tee /tmp/build.log | tail -60
      - name: Collect artifacts
        run: |
          cd "$WORK/out/target/product/c7ltechn"
          sha256sum boot.img recovery.img system.img 2>/dev/null > SHA256SUMS || true
          ls -la
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c7ltechn-los16-${{ github.run_number }}
          path: |
            /tmp/android/out/target/product/c7ltechn/boot.img
            /tmp/android/out/target/product/c7ltechn/recovery.img
            /tmp/android/out/target/product/c7ltechn/system.img
            /tmp/android/out/target/product/c7ltechn/SHA256SUMS
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          if-no-files-found: warn
