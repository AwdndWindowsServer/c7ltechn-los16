name: build

# Cancel superseded runs (a new push aborts the previous build)
concurrency:
  group: c7ltechn-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Optional runner label override for the ROM job (e.g.
          ubuntu-22.04-16core on GitHub Larger Runners). Default: ubuntu-latest.'
        required: false
        default: ''
      build_target:
        description: 'ROM build target'
        required: false
        default: 'bacon'
  push:
    branches: [ 'main' ]
    paths:
      - 'device/**'
      - 'vendor/**'
      - 'manifest/**'
      - 'tools/**'
      - '.github/workflows/build.yml'

jobs:
  kernel-build:
    name: kernel (Image.gz-dtb)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    timeout-minutes: 180
    env:
      WORK: /tmp/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: manifest-repo
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          mkdir -p /etc/ssl/certs/java
          apt-get install -y --no-install-recommends \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python2 python2-dev python3 python3-dev openjdk-8-jdk libncurses5 \
            lib32stdc++6 lib32gcc1 bc rsync ccache
          ln -sf /usr/bin/python2 /usr/local/bin/python
          if ! curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo; then
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/main/repo -o /usr/local/bin/repo || \
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/stable/repo -o /usr/local/bin/repo
          fi
          chmod +x /usr/local/bin/repo
          test -s /usr/local/bin/repo
          repo --version
      - name: Initialize repo
        run: |
          git config --global user.name "c7ltechn-bot"
          git config --global user.email "c7ltechn-bot@users.noreply.github.com"
          mkdir -p "$WORK"
          cd "$WORK"
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifest-repo/manifest/c7ltechn-16.0.xml" .repo/local_manifests/
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('.repo/local_manifests/c7ltechn-16.0.xml'); print('manifest XML OK')"
      - name: Sync kernel only
        run: |
          cd "$WORK"
          repo sync -c -j8 --no-tags --no-clone-bundle kernel/samsung/msm8953
          df -h /tmp
      - name: Fetch aarch64 gcc 4.9 toolchain (git clone preserves symlinks)
        run: |
          mkdir -p "$WORK/toolchain"
          git clone --depth 1 -b android-9.0.0_r46 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$WORK/toolchain"
          chmod +x "$WORK/toolchain/bin/"* 2>/dev/null || true
          ls -la "$WORK/toolchain/bin/" | head -8
          test -x "$WORK/toolchain/bin/aarch64-linux-android-gcc"
      - name: Build kernel
        run: |
          cd "$WORK/kernel/samsung/msm8953"
          export PATH="$WORK/toolchain/bin:$PATH"
          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -1
          make ARCH=arm64 lineageos_c7ltechn_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- -j$(nproc) Image.gz-dtb 2>&1 | tail -30
          ls -la arch/arm64/boot/
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: c7ltechn-kernel-${{ github.run_number }}
          path: |
            /tmp/android/kernel/samsung/msm8953/arch/arm64/boot/Image.gz-dtb
            /tmp/android/kernel/samsung/msm8953/.config
          if-no-files-found: error

  rom-build:
    name: ROM (boot+recovery+system)
    # Runs on every trigger. Standard runners (7GB RAM / ~145GB disk) can now
    # hold a LOS16 tree; RAM is tight so a swap file + low parallelism is used.
    # A GitHub Larger Runner (e.g. ubuntu-22.04-16core) is recommended for fast,
    # reliable full builds — pass it via the 'runner' input.
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    container:
      image: ubuntu:20.04
    timeout-minutes: 360
    env:
      WORK: /tmp/android
      CCACHE_DIR: /tmp/ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: manifest-repo
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          mkdir -p /etc/ssl/certs/java
          apt-get install -y --no-install-recommends \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python2 python2-dev python3 python3-dev openjdk-8-jdk libncurses5 \
            lib32stdc++6 lib32gcc1 bc rsync ccache
          ln -sf /usr/bin/python2 /usr/local/bin/python
          if ! curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo; then
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/main/repo -o /usr/local/bin/repo || \
            curl -fsSL https://raw.githubusercontent.com/Git-repo/repo/stable/repo -o /usr/local/bin/repo
          fi
          chmod +x /usr/local/bin/repo
          test -s /usr/local/bin/repo
          repo --version
      - name: Best-effort swap
        run: |
          free -h
          if fallocate -l 8G /tmp/swapfile 2>/dev/null; then
            chmod 600 /tmp/swapfile && mkswap /tmp/swapfile >/dev/null && swapon /tmp/swapfile
            echo "swap enabled"
          fi || true
          df -h /tmp
      - name: Initialize repo
        run: |
          git config --global user.name "c7ltechn-bot"
          git config --global user.email "c7ltechn-bot@users.noreply.github.com"
          mkdir -p "$WORK"
          cd "$WORK"
          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifest-repo/manifest/c7ltechn-16.0.xml" .repo/local_manifests/
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('.repo/local_manifests/c7ltechn-16.0.xml'); print('manifest XML OK')"
      - name: Sync sources
        run: |
          cd "$WORK"
          repo sync -c -j8 --no-tags --no-clone-bundle --force-sync 2>&1 | tail -40
          df -h /tmp
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}
      - name: Build
        run: |
          cd "$WORK"
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=/tmp/ccache
          ccache -M 20G
          source build/envsetup.sh
          lunch lineage_c7ltechn-userdebug
          m "${{ github.event.inputs.build_target || 'bacon' }}" -j$(nproc) 2>&1 | tee /tmp/build.log | tail -60
      - name: Collect artifacts
        run: |
          cd "$WORK/out/target/product/c7ltechn"
          sha256sum boot.img recovery.img system.img 2>/dev/null > SHA256SUMS || true
          ls -la
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c7ltechn-los16-${{ github.run_number }}
          path: |
            /tmp/android/out/target/product/c7ltechn/boot.img
            /tmp/android/out/target/product/c7ltechn/recovery.img
            /tmp/android/out/target/product/c7ltechn/system.img
            /tmp/android/out/target/product/c7ltechn/SHA256SUMS
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          if-no-files-found: warn
